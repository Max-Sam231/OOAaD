name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-test-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SpaceBattle
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Run OOAnD Architecture & Comment Linter
        working-directory: .
        run: python3 .agents/hooks/ooand-lint-gate.py --check-all .

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Verify Formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with 100% Coverage
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Coverage Gate (100% Line & 100% Branch)
        id: coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: success() || failure()
        with:
          filename: SpaceBattle/coverage/**/coverage.cobertura.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '100 100'

      - name: Add PR Coverage Report
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request' && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure')
        with:
          recreate: true
          path: code-coverage-results.md
